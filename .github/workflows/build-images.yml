name: build-images

on:
  push:
    branches:
      - main
    paths:
      - "dockerfiles/**"
  workflow_dispatch:
    inputs:
      push:
        description: "Publish images to the registry (otherwise build-only)"
        required: false
        type: boolean
        default: true
      push_latest:
        description: "Also update the :latest tag"
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: "Rebuild ALL images even if already published"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Options
        id: vars
        run: |
          set -euo pipefail
          do_push="false"
          push_latest="false"
          force_rebuild="false"
          case "${GITHUB_EVENT_NAME}" in
            push)
              do_push="true"
              ;;
            workflow_dispatch)
              do_push="${{ inputs.push }}"
              push_latest="${{ inputs.push_latest }}"
              force_rebuild="${{ inputs.force_rebuild }}"
              ;;
          esac
          v="do_push=${do_push}"              && echo "$v" && echo "$v" >> "$GITHUB_OUTPUT"
          v="push_latest=${push_latest}"      && echo "$v" && echo "$v" >> "$GITHUB_OUTPUT"
          v="force_rebuild=${force_rebuild}"  && echo "$v" && echo "$v" >> "$GITHUB_OUTPUT"

      - name: Detect changed images
        id: changed
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "mode=all"
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "ids="     >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t all < <(bash ./maketool.sh ids)
          in_all() {
            for a in "${all[@]}"; do [ "$a" = "$1" ] && return 0; done
            return 1
          }
          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            changed=("${all[@]}")
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "ERROR: base commit $base is not reachable (history was rewritten by force-push/rebase)." >&2
            echo "       Re-run this workflow manually (workflow_dispatch) to build all." >&2
            exit 1
          else
            changed=()
            while read -r f; do
              case "$f" in
                dockerfiles/*)
                  id="${f#dockerfiles/}"
                  changed+=("${id%/*}")
                  ;;
              esac
            done < <(git diff --name-only "$base" "${{ github.sha }}" -- dockerfiles/)
          fi
          declare -A want parent
          declare -a want_list=()
          add_want() { want["$1"]=1; want_list+=("$1"); }
          for id in "${changed[@]}"; do if in_all "$id"; then add_want "$id"; fi; done
          while read -r id p; do parent["$id"]="$p"; done < <(bash ./maketool.sh parents)
          progress=1
          while [ "$progress" = "1" ]; do
            progress=0
            for id in "${all[@]}"; do
              p="${parent[$id]:-}"
              if [ -n "$p" ] && [ -n "${want[$p]:-}" ] && [ -z "${want[$id]:-}" ]; then
                add_want "$id"
                progress=1
              fi
            done
          done
          if [ "${#want_list[@]}" -gt 0 ]; then
            ids="$(printf '%s\n' "${want_list[@]}" | sort -u | paste -sd, -)"
            echo "Changed images: $(tr ',' ' ' <<< "$ids")"
          else
            ids=""
            echo "No images changed"
          fi
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "ids=${ids}"   >> "$GITHUB_OUTPUT"

      - name: Validate
        run: bash ./maketool.sh validate

      - name: Build images (build-only)
        if: steps.vars.outputs.do_push != 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.changed.outputs.mode }}" = "changed" ]; then
            ids="${{ steps.changed.outputs.ids }}"
            [ -z "$ids" ] && { echo "Nothing to build"; exit 0; }
            mapfile -t list < <(tr ',' '\n' <<< "$ids")
            bash ./maketool.sh build "${list[@]}" \
              SUMMARY=/tmp/mt-summary.tsv \
              OCI_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
              OCI_REVISION="${{ github.sha }}"
          else
            bash ./maketool.sh build \
              SUMMARY=/tmp/mt-summary.tsv \
              OCI_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
              OCI_REVISION="${{ github.sha }}"
          fi

      - name: Log in to Container Registry
        if: steps.vars.outputs.do_push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & push images
        if: steps.vars.outputs.do_push == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.changed.outputs.mode }}" = "changed" ]; then
            ids="${{ steps.changed.outputs.ids }}"
            [ -z "$ids" ] && { echo "Nothing to push"; exit 0; }
            mapfile -t list < <(tr ',' '\n' <<< "$ids")
            bash ./maketool.sh release "${list[@]}" \
              SUMMARY=/tmp/mt-summary.tsv \
              REGISTRY="${{ vars.REGISTRY }}" NAMESPACE="${{ github.repository }}" \
              PUSH_LATEST="${{ steps.vars.outputs.push_latest }}" \
              ALLOW_OVERWRITE="${{ steps.vars.outputs.force_rebuild }}" \
              OCI_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
              OCI_REVISION="${{ github.sha }}"
          else
            bash ./maketool.sh release \
              SUMMARY=/tmp/mt-summary.tsv \
              REGISTRY="${{ vars.REGISTRY }}" NAMESPACE="${{ github.repository }}" \
              PUSH_LATEST="${{ steps.vars.outputs.push_latest }}" \
              ALLOW_OVERWRITE="${{ steps.vars.outputs.force_rebuild }}" \
              OCI_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
              OCI_REVISION="${{ github.sha }}"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Image build results"
            echo
            f=/tmp/mt-summary.tsv
            if [ -s "$f" ]; then
              echo "| Image | Result | Ref |"
              echo "| ----- | ------ | --- |"
              while IFS=$'\t' read -r id st ref; do
                echo "| \`$id\` | $st | \`$ref\` |"
              done < "$f"
              echo
              awk -F'\t' '{c[$2]++} END{printf "%d built %d pushed %d skipped %d failed\n",
                c["built"]+0, c["pushed"]+0, c["skipped"]+0, c["failed"]+0}' "$f"
            else
              echo "_No images processed._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
